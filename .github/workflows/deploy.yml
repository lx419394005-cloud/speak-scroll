# 可选备用：本机/Cloudflare Workers Builds 才是主路径。
# 若已在 Cloudflare Dashboard 连 GitHub（Workers Builds），请关掉本 workflow，
# 或只保留 workflow_dispatch，避免 push 时双部署 / Secrets 未配导致红叉。
name: Deploy Speak Scroll (optional Actions)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            worker/package-lock.json

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 GitHub Secrets：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            echo "创建 Token：https://developers.cloudflare.com/fundamentals/api/get-started/create-token/"
            echo "权限需含 Workers Scripts Edit + Workers R2 Storage Edit"
            exit 1
          fi

      - name: Install root
        run: npm ci

      - name: Install client
        run: npm ci --prefix client

      - name: Install worker
        run: npm ci --prefix worker --legacy-peer-deps

      - name: Build client
        run: npm run build --prefix client

      - name: Strip word images from assets (served via R2)
        run: rm -rf client/dist/words

      - name: Upload word images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ./scripts/upload-words-r2.sh

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name speak-scroll
